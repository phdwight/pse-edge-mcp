name: Release

# Merges to main publish a multi-arch container image to GHCR:
#   docker pull ghcr.io/phdwight/pse-edge-mcp:latest        # linux/amd64 + linux/arm64
#
# A merge that bumps `version` in pyproject.toml also cuts a GitHub Release and a
# matching immutable image tag; merges that don't bump only move :latest and :sha-*.
#
# Each architecture is built on its OWN NATIVE RUNNER (free for public repos) rather
# than emulated under QEMU, which keeps builds fast and — more importantly — lets the
# gates run natively per arch. Invariant #5 (thin, secret-free images) is enforced on
# every architecture BEFORE anything reaches the registry, so a bloated or broken
# arm64 image can't ride along behind a passing amd64 one.
#
# Publishing is two-phase: each arch pushes an untagged blob addressed by digest, then
# the merge job stitches those digests into one manifest list under the real tags. That
# way a tag never exists in a half-published state.

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-publish the current main on demand

permissions:
  contents: write # create the release + tag
  packages: write # push to GHCR

# Never let two main merges publish concurrently, and never cancel a half-done
# publish: an interrupted push can leave :latest pointing at nothing useful.
concurrency:
  group: release-main
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      bumped: ${{ steps.version.outputs.bumped }}
      tags: ${{ steps.version.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2 # need HEAD~1 to tell whether the version changed

      - name: Resolve version and detect a bump
        id: version
        run: |
          read_version() { grep -m1 '^version = ' "$1" | cut -d'"' -f2; }
          VERSION=$(read_version pyproject.toml)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi
          git show HEAD~1:pyproject.toml > /tmp/prev-pyproject.toml 2>/dev/null || : > /tmp/prev-pyproject.toml
          PREVIOUS=$(read_version /tmp/prev-pyproject.toml || true)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$VERSION" != "$PREVIOUS" ]; then
            BUMPED=true
            echo "Version bump: ${PREVIOUS:-none} -> $VERSION (will cut a release)"
          else
            BUMPED=false
            echo "Version unchanged at $VERSION (no release; :latest still moves)"
          fi
          echo "bumped=$BUMPED" >> "$GITHUB_OUTPUT"
          # Assembled here, not with an inline conditional at the point of use, so a
          # no-bump build can never emit an empty tag.
          TAGS="${IMAGE}:latest ${IMAGE}:sha-${GITHUB_SHA}"
          if [ "$BUMPED" = "true" ]; then TAGS="$TAGS ${IMAGE}:${VERSION}"; fi
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Fail if this release tag already exists
        if: steps.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG already exists — bump the version in pyproject.toml"
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run pytest -q

  build:
    needs: [test, version]
    strategy:
      fail-fast: false # report both arches' problems in one run, not just the first
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.14"
      - uses: docker/setup-buildx-action@v4

      # Load into the local daemon first so the gates below run on the exact bits that
      # get pushed. Native runner => no QEMU, and `docker run` works for the smoke test.
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: pse-edge-mcp:candidate
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

      # Enforces necessity, not a megabyte number — see scripts/check_image.py.
      - name: Check image contains only what the app needs
        run: |
          # pipefail matters: without it the pipeline returns tee's status and a failed
          # check would pass silently.
          set -eo pipefail
          uv sync --all-extras --quiet
          {
            echo "### \`${{ matrix.arch }}\` image"
            echo '```'
            uv run python scripts/check_image.py pse-edge-mcp:candidate --extra postgres --extra auth
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scan image for secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pse-edge-mcp:candidate
          scanners: secret
          exit-code: "1"

      - name: Smoke-test the image
        run: |
          # A published image that cannot build the server is worse than no publish.
          ARCH=$(docker image inspect pse-edge-mcp:candidate --format '{{.Architecture}}')
          echo "Image architecture: $ARCH (expected ${{ matrix.arch }})"
          test "$ARCH" = "${{ matrix.arch }}"
          TOOLS=$(docker run --rm --entrypoint python pse-edge-mcp:candidate -c '
          import asyncio
          from pse_edge_mcp.server import build_server
          print(len(asyncio.run(build_server().list_tools())))')
          echo "Tools registered: $TOOLS"
          test "$TOOLS" -ge 6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Push untagged, addressed only by digest. The merge job gives these real tags.
      # provenance/sbom off so the manifest list holds exactly one entry per arch.
      - name: Push ${{ matrix.platform }} by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          provenance: false
          sbom: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}

      - name: Export digest
        run: |
          DIGEST="${{ steps.push.outputs.digest }}"
          if [ -z "$DIGEST" ]; then
            echo "::error::push produced no digest"
            exit 1
          fi
          echo "Pushed ${{ matrix.arch }} as $DIGEST"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [build, version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Create the multi-arch manifest list
        env:
          TAGS: ${{ needs.version.outputs.tags }}
        run: |
          cd /tmp/digests
          COUNT=$(ls -1 | wc -l)
          echo "Digests to combine: $COUNT"
          test "$COUNT" -eq 2 # one per architecture; fewer means an arch silently dropped
          TAG_ARGS=""
          for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAG_ARGS \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Verify both architectures are published
        run: |
          PLATFORMS=$(docker buildx imagetools inspect "${IMAGE}:latest" --format '{{json .Manifest}}' \
            | jq -r '.manifests[]? | select(.platform.architecture != "unknown")
                     | .platform.os + "/" + .platform.architecture' | sort -u)
          echo "Published platforms:"; echo "$PLATFORMS"
          echo "$PLATFORMS" | grep -qx "linux/amd64" || { echo "::error::linux/amd64 missing"; exit 1; }
          echo "$PLATFORMS" | grep -qx "linux/arm64" || { echo "::error::linux/arm64 missing"; exit 1; }

      - name: Create release
        if: needs.version.outputs.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v${VERSION}" \
            --notes "$(cat <<EOF
          Multi-arch container image (\`linux/amd64\`, \`linux/arm64\`) for v${VERSION}:

          \`\`\`bash
          docker pull ${IMAGE}:${VERSION}
          \`\`\`

          Also published as \`${IMAGE}:latest\`.

          Serve streamable HTTP on :8000 (the image default):

          \`\`\`bash
          docker run --rm -p 8000:8000 ${IMAGE}:${VERSION}
          \`\`\`

          Or stdio, for Claude Desktop/Code (\`--entrypoint\` clears the default HTTP args):

          \`\`\`bash
          docker run --rm -i --entrypoint pse-edge-mcp ${IMAGE}:${VERSION}
          \`\`\`

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/v${VERSION}/CHANGELOG.md) for what changed.
          EOF
          )"

      - name: Summarise the download
        run: |
          {
            echo "## Published (linux/amd64 + linux/arm64)"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:latest"
            if [ "${{ needs.version.outputs.bumped }}" = "true" ]; then
              echo "docker pull ${IMAGE}:${{ needs.version.outputs.version }}"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
