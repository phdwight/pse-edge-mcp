# Deployment for a NAS (UGREEN UGOS, Synology, QNAP) or any single Docker host.
#
#   Stage 1 — LAN only, what this file does on its own:
#       docker compose -f compose.nas.yaml up -d
#     Reachable at http://<nas-ip>:8200. Nothing is exposed to the internet.
#
#   Stage 2 — add a public hostname through a Cloudflare Tunnel:
#       docker compose -f compose.nas.yaml -f compose.tunnel.yaml up -d --remove-orphans
#     That overlay starts cloudflared *and* unpublishes the port below, so going public
#     closes the LAN door in the same action rather than leaving it to be remembered.
#
# Self-contained on purpose: NAS Docker UIs import a single compose file far more happily
# than a base plus an overlay. It *pulls* the published image rather than building — a NAS
# is a poor build host, and the published image is already gated and multi-arch.
#
# Required in .env next to this file:
#   POSTGRES_PASSWORD   long and random
# Strongly recommended:
#   PSE_IMAGE_TAG       pin a version (e.g. 0.7.0). :latest is a moving target, and a tag
#                       that lags this file reads as a broken deployment rather than a
#                       version mismatch.
#
# Passkey signup does not work over plain http — browsers restrict WebAuthn to secure
# contexts — so on the LAN you mint a token with the admin CLI instead:
#   docker compose -f compose.nas.yaml exec app pse-edge-admin create-user you@example.com
#   docker compose -f compose.nas.yaml exec app pse-edge-admin issue-token you@example.com
# Signup, OAuth and passkeys all become real in stage 2, under the https hostname.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pse_edge
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published. Only app, backup and purge reach Postgres, over the compose network;
    # exposing 5432 to a LAN is the most common way these get compromised.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pse -d pse_edge"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Schema is applied by an explicit one-shot job, never by the server on boot.
  migrate:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    # LAN access for stage 1. 8200 rather than 8000: on a NAS with a few things already
    # running, 8000 is one of the most contested numbers there is. Only the published side
    # matters — the app always listens on 8000 inside the container, which is what the
    # tunnel routes to.
    #
    # In stage 2, set PSE_LAN_BIND=127.0.0.1 so this binds to the NAS's own loopback and
    # stops being reachable from the LAN. (An overlay cannot simply remove a port: Compose
    # merges `ports` additively, so a second file can only ever add more.)
    ports:
      - "${PSE_LAN_BIND:-0.0.0.0}:${PSE_LAN_PORT:-8200}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
      # On, even on the LAN: a NAS is a shared machine, and turning auth on afterwards
      # would orphan any token minted while it was off.
      PSE_AUTH_REQUIRED: "1"
      # Stage 1 has no public hostname yet. compose.tunnel.yaml overrides this with the
      # real https URL, which is the value WebAuthn binds every passkey to.
      PSE_PUBLIC_URL: ${PSE_PUBLIC_URL:-http://localhost:${PSE_LAN_PORT:-8200}}
      PSE_LOG_JSON: "1"
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      PSE_EMAIL_FROM: ${PSE_EMAIL_FROM:-no-reply@localhost}
      PSE_DB_POOL_SIZE: ${PSE_DB_POOL_SIZE:-10}
      PSE_DB_MAX_OVERFLOW: ${PSE_DB_MAX_OVERFLOW:-5}
      PSE_QUOTA_PER_MIN: ${PSE_QUOTA_PER_MIN:-60}
      PSE_QUOTA_PER_DAY: ${PSE_QUOTA_PER_DAY:-2000}
    # One worker by default. A NAS CPU has few cores, and every worker multiplies the
    # in-memory quota ceiling (limits are per process) while adding a second parse memo to
    # warm. Raise it only if you measure CPU saturation, and raise limits with it.
    command: ["--http", "--port", "8000", "--workers", "${PSE_WORKERS:-1}"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only — a readiness probe here would restart the container during a
      # database blip instead of merely taking it out of rotation.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-768m}
    logging: *logging

  # Daily pg_dump into ./backups. Keep this directory on a NAS share that is itself part of
  # your normal backup routine — a dump sitting on the same disk as the database protects
  # you from mistakes, not from disk failure.
  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # 18:00 UTC = 02:00 Asia/Manila: after the close and away from the boundary
          # refetch, so a dump never competes with the day's one upstream fetch.
          if [ "$$(date -u +%H%M)" = "1800" ]; then
            stamp=$$(date -u +%Y%m%dT%H%M%SZ)
            if pg_dump -h db -U pse -d pse_edge --format=custom \
                 --file="/backups/pse_edge-$$stamp.dump"; then
              echo "backup: wrote pse_edge-$$stamp.dump"
              # Rotate only after a *successful* dump: pruning first would trade a good
              # backup for a failed one.
              find /backups -name 'pse_edge-*.dump' -type f \
                   -mtime +$${BACKUP_RETENTION_DAYS} -delete
            else
              echo "backup: FAILED for $$stamp" >&2
            fi
            sleep 3600
          fi
          sleep 30
        done
    logging: *logging

  # Usage-retention purge (plan §6a). The server also purges once a day on its own, so this
  # is the belt-and-braces for a NAS that reboots often enough to never reach that.
  purge:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          pse-edge-admin purge-usage --retention-days ${PSE_USAGE_RETENTION_DAYS:-90} || true
        done
    logging: *logging

volumes:
  pgdata:
