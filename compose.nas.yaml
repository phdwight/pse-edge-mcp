# Deployment for a NAS (UGREEN UGOS, Synology, QNAP) or any single Docker host.
#
#   Stage 1 — LAN only, what this file does on its own:
#       docker compose -f compose.nas.yaml up -d
#     Reachable at http://<nas-ip>:8200. Nothing is exposed to the internet.
#
#   Stage 2 — add a public hostname through a Cloudflare Tunnel:
#       docker compose -f compose.nas.yaml -f compose.tunnel.yaml up -d --remove-orphans
#     Set PSE_LAN_BIND=127.0.0.1 in .env at the same time — that is what stops the port
#     below being reachable from the LAN once the hostname is public.
#
# Self-contained on purpose: NAS Docker UIs import a single compose file far more happily
# than a base plus an overlay. It *pulls* the published image rather than building — a NAS
# is a poor build host, and the published image is already gated and multi-arch.
#
# Required in .env next to this file:
#   POSTGRES_PASSWORD   long and random
# Strongly recommended:
#   PSE_IMAGE_TAG       pin a version (e.g. 0.11.0). :latest is a moving target, and a tag
#                       that lags this file reads as a broken deployment rather than a
#                       version mismatch.
#   PSE_LAN_PORT        if 8200 is already taken. A clash leaves the app container created
#                       but never started, with NO logs at all — the process never ran, so
#                       an empty log is the symptom. `docker ps --format '{{.Ports}}'`
#                       shows what already holds it.
#   PSE_PGDATA_PATH     absolute host path for the database, e.g. /volume1/docker/pse/pgdata
#   PSE_BACKUP_PATH     absolute host path for pg_dump output
#                       Unset, both use Docker-managed storage. Set, they become directories
#                       you can see and snapshot from the NAS UI. CREATE THEM FIRST —
#                       Docker will not, and the mount error does not name the missing path.
#                       Keep backups OUTSIDE the database directory: a backup stored inside
#                       the thing it protects is not a backup.
#
#                       ⚠ Setting PSE_PGDATA_PATH on an EXISTING deployment starts from an
#                       empty database — the old volume is untouched but no longer read, so
#                       accounts, passkeys and machine clients appear to vanish. Dump first,
#                       switch, then restore; see docs/deploy.md.
#
# Passkey signup does not work over plain http — browsers restrict WebAuthn to secure
# contexts — so on the LAN you mint a token with the admin CLI instead:
#   docker compose -f compose.nas.yaml exec app pse-edge-admin create-user you@example.com
#   docker compose -f compose.nas.yaml exec app pse-edge-admin issue-token you@example.com
# Signup, OAuth and passkeys all become real in stage 2, under the https hostname.

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pse_edge
    volumes:
      # Unset, a Docker-managed named volume. Set to an absolute path, a bind mount on a
      # NAS directory you can see and snapshot. Compose picks which from the shape of the
      # value, so one variable covers both.
      #
      # The `pgdata-owner` service below is what makes the bind case work — see there.
      # It must be the NAS's OWN internal volume, never SMB/NFS/USB: Postgres needs POSIX
      # locking and honest fsync, and will refuse to start or corrupt quietly without them.
      - ${PSE_PGDATA_PATH:-pgdata}:/var/lib/postgresql
    # Not published. Only app, backup and purge reach Postgres, over the compose network;
    # exposing 5432 to a LAN is the most common way these get compromised.
    depends_on:
      pgdata-owner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pse -d pse_edge"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-1g}
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Postgres runs as uid 999, and a bind mount hands the container the HOST directory's
  # ownership — root, on a NAS — so without help the database crash-loops forever on
  # "mkdir: ... Permission denied". The usual advice is to chown from a shell, which is no
  # use on a NAS whose UI gives you none; so it happens here, before the database starts.
  #
  # The repair is UNCONDITIONAL (no "already looks right" shortcut — a top directory can
  # stat as uid 999 while the real answer is no), and then PROVED: a write is attempted as
  # uid 999, exactly as postgres will run. If that probe fails the container exits 1 and
  # the db never starts — one FATAL line naming the cause, instead of a crash loop. On a
  # NAS the usual culprit is folder ACLs layered over classic permissions; those are fixed
  # in the NAS file manager (grant read/write on the folder), no shell needed.
  #
  # It also prints what it found, because the operator has no shell to look for
  # themselves: the log is the `ls -la` they cannot run.
  pgdata-owner:
    image: postgres:18
    user: root
    volumes:
      - ${PSE_PGDATA_PATH:-pgdata}:/pgdata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "pgdata-owner: running as uid=$$(id -u), fs=$$(stat -f -c %T /pgdata 2>/dev/null || echo unknown)"
        echo "pgdata-owner: contents of the mounted directory:"
        ls -la /pgdata | head -12
        chown -R 999:999 /pgdata 2>&1 | head -3
        chmod -R u+rwX /pgdata 2>&1 | head -3
        if gosu postgres sh -c "touch /pgdata/.pse-write-probe && rm -f /pgdata/.pse-write-probe"; then
          echo "pgdata-owner: verified uid 999 can write — OK"
        else
          echo "pgdata-owner: FATAL — uid 999 (postgres) cannot write here even after" >&2
          echo "  chown/chmod. On a NAS this usually means folder ACLs override classic" >&2
          echo "  permissions. Fix in the NAS file manager: grant read/write on the" >&2
          echo "  PSE_PGDATA_PATH folder to all users, or recreate it in a plain (non-" >&2
          echo "  shared, no-ACL) location. The db will not start until this passes." >&2
          exit 1
        fi
    restart: "no"
    logging: *logging

  # Schema is applied by an explicit one-shot job, never by the server on boot: replicas must
  # not race to mutate their own schema (plan §5).
  #
  # This container RUNS ONCE AND EXITS 0. That is success, not failure. NAS Docker UIs show
  # it as "Not in use" / "Exited" and often colour the whole project red because of it —
  # check its log says "Running upgrade" and nothing after, and ignore the badge.
  migrate:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    # LAN access for stage 1. 8200 rather than 8000: on a NAS with a few things already
    # running, 8000 is one of the most contested numbers there is. Only the published side
    # matters — the app always listens on 8000 inside the container, which is what the
    # tunnel routes to.
    #
    # In stage 2, set PSE_LAN_BIND=127.0.0.1 so this binds to the NAS's own loopback and
    # stops being reachable from the LAN. (An overlay cannot simply remove a port: Compose
    # merges `ports` additively, so a second file can only ever add more.)
    ports:
      - "${PSE_LAN_BIND:-0.0.0.0}:${PSE_LAN_PORT:-8200}:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
      # On, even on the LAN: a NAS is a shared machine, and turning auth on afterwards
      # would orphan any token minted while it was off.
      PSE_AUTH_REQUIRED: "1"
      # Accounts allowed to provision machine clients from the /account web page (comma-
      # separated). Same authority as the pse-edge-admin CLI — the way to grant headless
      # agent access on a NAS with no shell. Empty = web provisioning off, CLI only.
      PSE_ADMIN_EMAILS: ${PSE_ADMIN_EMAILS:-}
      # Stage 1 has no public hostname yet. compose.tunnel.yaml overrides this with the
      # real https URL, which is the value WebAuthn binds every passkey to.
      PSE_PUBLIC_URL: ${PSE_PUBLIC_URL:-http://localhost:${PSE_LAN_PORT:-8200}}
      PSE_LOG_JSON: "1"
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      PSE_EMAIL_FROM: ${PSE_EMAIL_FROM:-no-reply@localhost}
      PSE_DB_POOL_SIZE: ${PSE_DB_POOL_SIZE:-10}
      PSE_DB_MAX_OVERFLOW: ${PSE_DB_MAX_OVERFLOW:-5}
      PSE_QUOTA_PER_MIN: ${PSE_QUOTA_PER_MIN:-60}
      PSE_QUOTA_PER_DAY: ${PSE_QUOTA_PER_DAY:-2000}
    # One worker by default. A NAS CPU has few cores, and every worker multiplies the
    # in-memory quota ceiling (limits are per process) while adding a second parse memo to
    # warm. Raise it only if you measure CPU saturation, and raise limits with it.
    command: ["--http", "--port", "8000", "--workers", "${PSE_WORKERS:-1}"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only — a readiness probe here would restart the container during a
      # database blip instead of merely taking it out of rotation.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${APP_MEMORY_LIMIT:-768m}
    logging: *logging

  # Daily pg_dump into ./backups. Keep this directory on a NAS share that is itself part of
  # your normal backup routine — a dump sitting on the same disk as the database protects
  # you from mistakes, not from disk failure.
  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      # Same switch as pgdata. Unlike the database, dumps are just files, so a network
      # share is fine here — and is in fact the better place for them, since a dump beside
      # the database it came from protects you from mistakes but not from disk failure.
      - ${PSE_BACKUP_PATH:-./backups}:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # 18:00 UTC = 02:00 Asia/Manila: after the close and away from the boundary
          # refetch, so a dump never competes with the day's one upstream fetch.
          if [ "$$(date -u +%H%M)" = "1800" ]; then
            stamp=$$(date -u +%Y%m%dT%H%M%SZ)
            if pg_dump -h db -U pse -d pse_edge --format=custom \
                 --file="/backups/pse_edge-$$stamp.dump"; then
              echo "backup: wrote pse_edge-$$stamp.dump"
              # Rotate only after a *successful* dump: pruning first would trade a good
              # backup for a failed one.
              find /backups -name 'pse_edge-*.dump' -type f \
                   -mtime +$${BACKUP_RETENTION_DAYS} -delete
            else
              echo "backup: FAILED for $$stamp" >&2
            fi
            sleep 3600
          fi
          sleep 30
        done
    logging: *logging

  # Usage-retention purge (plan §6a). The server also purges once a day on its own, so this
  # is the belt-and-braces for a NAS that reboots often enough to never reach that.
  purge:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          pse-edge-admin purge-usage --retention-days ${PSE_USAGE_RETENTION_DAYS:-90} || true
        done
    logging: *logging

  # Nightly schema canary (plan §6a). PSE Edge can restyle its HTML at any time; without
  # this the first person to find out is a user whose tool call just failed. Runs an hour
  # after the close, when the day's data exists, and emails PSE_OPERATOR_EMAIL only on
  # failure — a nightly "all fine" mail is filtered within a week, and a filtered alert is
  # worse than none because it feels like coverage.
  canary:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
      PSE_OPERATOR_EMAIL: ${PSE_OPERATOR_EMAIL:-}
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      PSE_EMAIL_FROM: ${PSE_EMAIL_FROM:-no-reply@localhost}
      PSE_LOG_JSON: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # 08:00 UTC = 16:00 Asia/Manila: one hour after the close, so the day's figures
          # are published. The canary refuses to run during market hours anyway.
          if [ "$$(date -u +%H%M)" = "0800" ]; then
            pse-edge-canary || echo "canary: FAILURES — see the report above" >&2
            sleep 3600
          fi
          sleep 30
        done
    logging: *logging

volumes:
  pgdata:
