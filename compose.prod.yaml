# Production deployment for a host reachable from the internet on ports 80 and 443
# (plan §7 Phase 6). Caddy terminates TLS and renews certificates automatically.
#
#   docker compose -f compose.prod.yaml up -d
#
# !! THE `Caddyfile` FROM THIS REPOSITORY MUST SIT NEXT TO THIS FILE. !!
# It is bind-mounted below, and Docker cannot mount a file that does not exist: the caddy
# container is then *created but never started*, with an OCI "not a directory" error, while
# every other service comes up fine. In a NAS UI that reads as the project being broken for
# no visible reason. If you imported only this compose file, copy Caddyfile beside it.
#
# Standalone, not an overlay on compose.yaml: production should not inherit a development
# file's build directives and published ports only to undo them, and a self-contained file
# is what NAS and PaaS UIs can import. It *pulls* the published image — production should
# run the artifact CI actually gated (size-checked against the resolved runtime closure,
# secret-scanned, smoke-tested, multi-arch), not a rebuild from whatever the deploy host's
# source tree and Docker cache happened to contain.
#
# For a host you cannot reach on 80/443 — CGNAT, a locked-down router, an ISP that blocks
# 80, or a NAS whose ports are already taken — use compose.nas.yaml + compose.tunnel.yaml
# instead. That path needs no inbound ports at all.
#
# Required in .env — the deployment will not be correct without them:
#   PSE_DOMAIN         the public hostname (Caddy obtains a certificate for it)
#   PSE_ACME_EMAIL     contact address for the certificate authority
#   POSTGRES_PASSWORD  something long and random
#   ZEPTOMAIL_API_KEY  for verification emails
# Strongly recommended:
#   PSE_IMAGE_TAG      pin a version (e.g. 0.7.2) instead of tracking :latest
#
# PSE_PUBLIC_URL is derived from PSE_DOMAIN below. Getting it wrong breaks passkeys in a way
# that looks like a browser bug, because WebAuthn binds credentials to the origin.

services:
  # TLS terminates here. Caddy obtains and renews certificates automatically, which is the
  # whole reason it is preferred over nginx+certbot for a single-service deployment.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      # Published high to stay clear of whatever else already runs on the host — a NAS
      # usually has its own web UI on 80 and 443. Only the *published* side moves; Caddy
      # still listens on 80/443 inside the container, so the Caddyfile is unchanged.
      #
      # THIS REQUIRES YOUR ROUTER TO FORWARD 80 -> 8280 AND 443 -> 8243. Certificate
      # authorities always connect on port 80 (HTTP-01) or 443 (TLS-ALPN-01); those numbers
      # are fixed in the protocol and no Caddy setting changes them. If the internet cannot
      # reach this host on 80/443 by some path, Caddy never obtains a certificate and the
      # site never serves at all.
      - "${PSE_HTTP_PORT:-8280}:80"
      - "${PSE_HTTPS_PORT:-8243}:443"
    environment:
      PSE_DOMAIN: ${PSE_DOMAIN:?set PSE_DOMAIN in .env}
      PSE_ACME_EMAIL: ${PSE_ACME_EMAIL:?set PSE_ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data      # certificates live here — losing this means re-issuing
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: pse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pse_edge
    volumes:
      - pgdata:/var/lib/postgresql
    # Not published: only app and backup reach Postgres, over the compose network. Exposing
    # 5432 to the host is the most common way these get compromised.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pse -d pse_edge"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          memory: ${DB_MEMORY_LIMIT:-2g}
    logging: *logging

  # Schema is applied by an explicit one-shot job, never by the server on boot: replicas
  # must not race to mutate their own schema (plan §5). Same image *and same tag* as app —
  # applying a schema with a different build than the one that reads it is the version skew
  # that actually corrupts.
  migrate:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    logging: *logging

  app:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    # No published ports: the app is reachable only through Caddy, so a stray firewall rule
    # cannot expose it unencrypted.
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
      # Auth is ON in production. Anonymous access to a public deployment is not a default
      # anyone should have to opt out of.
      PSE_AUTH_REQUIRED: "1"
      PSE_PUBLIC_URL: https://${PSE_DOMAIN:?set PSE_DOMAIN in .env}
      PSE_LOG_JSON: "1"
      ZEPTOMAIL_API_KEY: ${ZEPTOMAIL_API_KEY:-}
      PSE_EMAIL_FROM: ${PSE_EMAIL_FROM:-no-reply@${PSE_DOMAIN}}
      # Auth turns every request into a potential lookup, so the pool is sized above the
      # SQLAlchemy default rather than left to become the queue point.
      PSE_DB_POOL_SIZE: ${PSE_DB_POOL_SIZE:-20}
      PSE_DB_MAX_OVERFLOW: ${PSE_DB_MAX_OVERFLOW:-10}
      PSE_QUOTA_PER_MIN: ${PSE_QUOTA_PER_MIN:-60}
      PSE_QUOTA_PER_DAY: ${PSE_QUOTA_PER_DAY:-2000}
    # Workers share nothing in memory: quota windows, parse memo and token cache are all
    # per worker, so a user's effective ceiling is up to N x nominal. Two is a deliberate
    # compromise between using the cores and keeping limits meaningful.
    command: ["--http", "--port", "8000", "--workers", "${PSE_WORKERS:-2}"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only — a readiness probe here would restart the container during a
      # database blip instead of merely taking it out of rotation.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "${APP_CPU_LIMIT:-2.0}"
          memory: ${APP_MEMORY_LIMIT:-1g}
        reservations:
          memory: 256m
    logging: *logging

  # Daily pg_dump with rotation (plan §6a). The named volume plus these dumps cover the two
  # unrecoverable assets: user accounts and the accumulated archive.
  backup:
    image: postgres:18
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          # 18:00 UTC is 02:00 Asia/Manila — after the market closes and well away from
          # the boundary refetch, so a dump never competes with the day's one upstream hit.
          if [ "$$(date -u +%H%M)" = "1800" ]; then
            stamp=$$(date -u +%Y%m%dT%H%M%SZ)
            echo "backup: starting $$stamp"
            if pg_dump -h db -U pse -d pse_edge --format=custom \
                 --file="/backups/pse_edge-$$stamp.dump"; then
              echo "backup: wrote pse_edge-$$stamp.dump"
              # Rotate only *successful* dumps, and only after this one landed — pruning
              # first would trade a good backup for a failed one.
              find /backups -name 'pse_edge-*.dump' -type f \
                   -mtime +$${BACKUP_RETENTION_DAYS} -delete
            else
              echo "backup: FAILED for $$stamp" >&2
            fi
            sleep 3600
          fi
          sleep 30
        done
    logging: *logging

  # Retention purge (plan §6a): usage counts older than the window are deleted daily. The
  # running server also purges opportunistically once a day, so this is the belt-and-braces
  # for a deployment that restarts often enough to never reach its own purge.
  purge:
    image: ghcr.io/phdwight/pse-edge-mcp:${PSE_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/pse_edge
    depends_on:
      migrate:
        condition: service_completed_successfully
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          sleep 86400
          pse-edge-admin purge-usage --retention-days ${PSE_USAGE_RETENTION_DAYS:-90} || true
        done
    logging: *logging

volumes:
  pgdata:
  caddy_data:
  caddy_config:
