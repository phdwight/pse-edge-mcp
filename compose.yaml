# Compose v2 spec (no legacy `version:` key).
# `docker compose up` -> full dev stack (server on :8000 + Postgres 18).
name: pse-edge-mcp

services:
  # Schema is applied by an explicit one-shot job, never by the server on boot: replicas
  # must not race to mutate their own schema (plan §5). `docker compose up` still works
  # end to end because app waits for this to complete successfully.
  migrate:
    build: .
    entrypoint: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:-pse-dev-only}@db:5432/pse_edge
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://pse:${POSTGRES_PASSWORD:-pse-dev-only}@db:5432/pse_edge
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      # Liveness only — deliberately not /health/ready, so a database blip takes the
      # container out of rotation rather than restarting it into a loop.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Database browser, opt-in: `docker compose --profile tools up -d adminer`, then open
  # http://127.0.0.1:8081 and log in with System=PostgreSQL, Server=db, User=pse,
  # Password=$POSTGRES_PASSWORD (dev default pse-dev-only), Database=pse_edge. Bound to
  # loopback on purpose — a DB UI must never be reachable from off the machine, and the
  # profile keeps it out of the default `docker compose up` so nothing new runs unasked.
  adminer:
    image: adminer:5
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: pse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pse-dev-only}
      POSTGRES_DB: pse_edge
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pse -d pse_edge"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
